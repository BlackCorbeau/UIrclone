[package]
name = "UIrclone"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
dirs = "5.0"
which = "6.0"
serde_json = "1.0"
