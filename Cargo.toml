[package]
name = "UIrclone"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
futures = "0.3"
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
dirs = "5.0"
which = "6.0"
serde_json = "1.0"
chrono = "0.4"
rfd = "0.14"

# GUI
eframe = { version = "0.27", features = ["default"] }
egui = "0.27"
egui_extras = { version = "0.27" }

# Логирование
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tempfile = "3.8"
serial_test = "2.0"
mockito = "1.0"
